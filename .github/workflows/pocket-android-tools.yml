name: PocketR5900 - Android tools

# Builds the analyzer and recompiler as Android ARM64 programs, so they can
# run on the phone inside the PocketR5900 app.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "ps2xRecomp/**"
      - "ps2xAnalyzer/**"
      - ".github/workflows/pocket-android-tools.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DANDROID_CPP_FEATURES="rtti exceptions" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS2X_ANDROID_TOOLS=ON

      - name: Build
        run: cmake --build build

      - name: Collect
        run: |
          mkdir -p out
          cp build/ps2xAnalyzer/ps2_analyzer out/
          cp build/ps2xRecomp/ps2_recomp out/
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" out/*
          file out/*
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: pocketr5900-android-tools-arm64
          path: out/*
